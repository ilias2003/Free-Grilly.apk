name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix RTF files and Build Android App
      run: |
        find . -type f \( -name "*.gradle" -o -name "*.properties" -o -name "AndroidManifest.xml" \) -exec sed -i '/\\rtf1/,$!d' {} + || true
        gradle init --type basic --dsl groovy --test-framework none --project-name "App" --non-interactive || true
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
