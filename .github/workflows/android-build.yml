name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Recreate Gradle Files Cleanly and Build
      run: |
        # Διαγραφή των προβληματικών αρχείων RTF που δημιουργούν το σφάλμα
        rm -f settings.gradle build.gradle app/build.gradle
        
        # Δημιουργία καθαρού settings.gradle
        echo 'pluginManagement { repositories { google() mavenCentral() gradlePluginPortal() } }' > settings.gradle
        echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories { google() mavenCentral() } }' >> settings.gradle
        echo 'rootProject.name = "FreeGrillyApp"' >> settings.gradle
        echo "include ':app'" >> settings.gradle

        # Δημιουργία καθαρού root build.gradle
        echo 'buildscript { repositories { google() mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.1.4" } }' > build.gradle
        echo 'allprojects { repositories { google() mavenCentral() } }' >> build.gradle

        # Κατέβασμα Gradle Wrapper και Build
        gradle init --type basic --dsl groovy --test-framework none --project-name "App" --non-interactive || true
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
